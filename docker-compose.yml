# ============================================================
# EJECUTABLES — Procesador de integraciones Siesa
# Despliegue en Dokploy con Traefik.
#
# Carga y procesa archivos Excel para:
# - Pedidos (430/431)
# - Requisiciones (440/441)
# - Sobrecostos (451/452)
#
# Define las variables sensibles en el panel de variables de entorno de Dokploy.
# ============================================================
services:
  ejecutables:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5000"
      FLASK_ENV: production
      # Variables para conexión a Siesa (define en Dokploy):
      # SIESA_URL: ${SIESA_URL}
      # SIESA_USER: ${SIESA_USER}
      # SIESA_PASSWORD: ${SIESA_PASSWORD}
      # etc.
    expose:
      - "5000"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTP -> redirige a HTTPS
      - "traefik.http.routers.ejecutables-web.rule=Host(`ejecutables.grupo-santacruz.com`)"
      - "traefik.http.routers.ejecutables-web.entrypoints=web"
      - "traefik.http.routers.ejecutables-web.middlewares=ejecutables-redirect"
      # HTTPS
      - "traefik.http.routers.ejecutables-secure.rule=Host(`ejecutables.grupo-santacruz.com`)"
      - "traefik.http.routers.ejecutables-secure.entrypoints=websecure"
      - "traefik.http.routers.ejecutables-secure.tls=true"
      - "traefik.http.routers.ejecutables-secure.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.ejecutables-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.ejecutables.loadbalancer.server.port=5000"

networks:
  dokploy-network:
    external: true
