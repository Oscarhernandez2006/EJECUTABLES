# ============================================================
# EJECUTABLES (cnx) — Procesador de integraciones Siesa
# Despliegue en Dokploy (Docker Swarm) con Traefik.
#
# IMPORTANTE (Swarm): Traefik lee los labels del SERVICIO, por eso van bajo
# `deploy.labels` y NO bajo `labels:`. Así sobreviven a cada redeploy y ya no
# hay que reaplicarlos por SSH con `docker service update`.
#
# Define las variables sensibles en el panel de variables de entorno de Dokploy.
# ============================================================
services:
  cnx:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      FLASK_ENV: production
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=dokploy-network"
        # HTTP -> redirige a HTTPS
        - "traefik.http.routers.cnx-web.rule=Host(`cnx.grupo-santacruz.com`)"
        - "traefik.http.routers.cnx-web.entrypoints=web"
        - "traefik.http.routers.cnx-web.middlewares=cnx-redirect"
        - "traefik.http.middlewares.cnx-redirect.redirectscheme.scheme=https"
        # HTTPS
        - "traefik.http.routers.cnx-secure.rule=Host(`cnx.grupo-santacruz.com`)"
        - "traefik.http.routers.cnx-secure.entrypoints=websecure"
        - "traefik.http.routers.cnx-secure.tls=true"
        - "traefik.http.routers.cnx-secure.tls.certresolver=letsencrypt"
        # Puerto interno del contenedor (gunicorn escucha en 5000)
        - "traefik.http.services.cnx.loadbalancer.server.port=5000"

networks:
  dokploy-network:
    external: true
