# ============================================================
# EJECUTABLES (cnx) — Procesador de integraciones Siesa
# Despliegue en Dokploy con Traefik.
#
# Los labels de Traefik se declaran en DOS niveles a propósito:
#   - `labels:` (contenedor)  -> los lee Traefik si Dokploy despliega con
#     `docker compose` normal (provider docker). Es el caso de los servicios
#     tipo Compose en Dokploy.
#   - `deploy.labels:` (servicio) -> los lee Traefik si se despliega como stack
#     de Swarm (provider swarm).
# Así el enrutado funciona en cualquiera de los dos modos y persiste en cada
# redeploy, sin tener que reaplicarlos por SSH.
#
# Define las variables sensibles en el panel de variables de entorno de Dokploy.
# ============================================================
services:
  cnx:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      FLASK_ENV: production
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTP -> redirige a HTTPS
      - "traefik.http.routers.cnx-web.rule=Host(`cnx.grupo-santacruz.com`)"
      - "traefik.http.routers.cnx-web.entrypoints=web"
      - "traefik.http.routers.cnx-web.middlewares=cnx-redirect"
      - "traefik.http.middlewares.cnx-redirect.redirectscheme.scheme=https"
      # HTTPS
      - "traefik.http.routers.cnx-secure.rule=Host(`cnx.grupo-santacruz.com`)"
      - "traefik.http.routers.cnx-secure.entrypoints=websecure"
      - "traefik.http.routers.cnx-secure.tls=true"
      - "traefik.http.routers.cnx-secure.tls.certresolver=letsencrypt"
      # Puerto interno del contenedor (gunicorn escucha en 5000)
      - "traefik.http.services.cnx.loadbalancer.server.port=5000"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=dokploy-network"
        # HTTP -> redirige a HTTPS
        - "traefik.http.routers.cnx-web.rule=Host(`cnx.grupo-santacruz.com`)"
        - "traefik.http.routers.cnx-web.entrypoints=web"
        - "traefik.http.routers.cnx-web.middlewares=cnx-redirect"
        - "traefik.http.middlewares.cnx-redirect.redirectscheme.scheme=https"
        # HTTPS
        - "traefik.http.routers.cnx-secure.rule=Host(`cnx.grupo-santacruz.com`)"
        - "traefik.http.routers.cnx-secure.entrypoints=websecure"
        - "traefik.http.routers.cnx-secure.tls=true"
        - "traefik.http.routers.cnx-secure.tls.certresolver=letsencrypt"
        # Puerto interno del contenedor (gunicorn escucha en 5000)
        - "traefik.http.services.cnx.loadbalancer.server.port=5000"

networks:
  dokploy-network:
    external: true
